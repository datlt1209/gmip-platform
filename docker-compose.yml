services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmip_backend
    restart: always
    environment:
      PORT: "8000"
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: sqlite:////app/data/gmip.db
      FRED_API_KEY: ${FRED_API_KEY:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - gmip_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined at build time; must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    container_name: gmip_frontend
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gmip_data:
